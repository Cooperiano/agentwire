name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx wrangler deploy --dry-run
      - name: Check public release safety
        if: github.repository == 'Cooperiano/agentwire'
        run: bash scripts/check-public-safety.sh .
